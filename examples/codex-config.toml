[mcp_servers.langfuse]
command = "uvx"
args = ["--python", "3.11", "--with", "mcp>=1.28,<2", "langfuse-mcp==0.10.0"]

[mcp_servers.langfuse.env]
# Use the Langfuse host that owns the API keys below.
LANGFUSE_HOST = "http://localhost:3000"
LANGFUSE_PUBLIC_KEY = "<LANGFUSE_PUBLIC_KEY>"
LANGFUSE_SECRET_KEY = "<LANGFUSE_SECRET_KEY>"
# Workspace identity needs no configuration; the exporter uses Git and hostname directly.
